name: Qodana

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  qodana:
    # Fork pull requests and Dependabot do not have access to QODANA_TOKEN.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild TailwindCSSIntellisense.slnx /restore /p:Configuration=Release /p:DeployExtension=false

      - name: Qodana scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          upload-result: true
          post-pr-comment: false
          use-annotations: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
