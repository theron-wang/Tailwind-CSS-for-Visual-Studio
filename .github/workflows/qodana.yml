name: Qodana

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qodana:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild TailwindCSSIntellisense.slnx /restore /p:Configuration=Release /p:DeployExtension=false

      - name: Qodana scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          upload-result: true
          post-pr-comment: false
          use-annotations: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
